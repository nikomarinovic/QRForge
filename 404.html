<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRForge — 404</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background: var(--surface-0);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
    }

    /* Blueprint grid field */
    .grid-field {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(127,217,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(127,217,255,0.06) 1px, transparent 1px);
      background-size: 44px 44px;
      animation: gridDrift 24s linear infinite;
    }
    @keyframes gridDrift { from { background-position: 0 0; } to { background-position: 44px 44px; } }
    .grid-field::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(44,92,214,0.16) 0%, transparent 70%);
    }

    /* Sweeping scan line, like a laser QR reader pass */
    .scan-bar {
      position: fixed;
      left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 5%, rgba(127,217,255,0.7) 50%, transparent 95%);
      box-shadow: 0 0 12px rgba(127,217,255,0.5);
      animation: scanSweep 4.5s ease-in-out infinite;
      z-index: 3; pointer-events: none;
    }
    @keyframes scanSweep {
      0%   { top: -2px; opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 0.8; }
      100% { top: 100vh; opacity: 0; }
    }

    .page-404 {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2.25rem;
    }

    /* Corrupted QR — broken finder pattern, drawn as static SVG (no dependency) */
    .broken-qr-wrap {
      position: relative;
      width: 168px;
      height: 168px;
    }
    .broken-qr-wrap svg { display: block; width: 100%; height: 100%; }
    .bq-glitch {
      position: absolute; inset: 0;
      mix-blend-mode: screen;
      opacity: 0.55;
      animation: glitchShift 2.6s steps(1) infinite;
    }
    @keyframes glitchShift {
      0%,88%,100% { transform: translate(0,0); clip-path: none; }
      90% { transform: translate(-4px,2px); clip-path: polygon(0 20%,100% 20%,100% 42%,0 42%); }
      93% { transform: translate(4px,-2px); clip-path: polygon(0 62%,100% 62%,100% 80%,0 80%); }
      96% { transform: translate(-2px,3px); clip-path: none; }
    }

    .code-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(44,92,214,0.14);
      border: 1px solid rgba(44,92,214,0.35);
      padding: 5px 12px;
      border-radius: 3px;
    }
    .code-label::before { content: ''; width: 5px; height: 5px; background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    .err-num {
      font-family: var(--font-display);
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text-primary);
    }

    .text-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      max-width: 380px;
    }
    .err-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .err-sub {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 9999px;
      background: linear-gradient(135deg, var(--blue-500), var(--blue-700));
      color: var(--accent-bright);
      font-weight: 500;
      font-size: 0.9375rem;
      text-decoration: none;
      box-shadow: var(--shadow-glow);
      transition: transform 0.2s var(--ease-spring), box-shadow 0.2s;
    }
    .home-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(44,92,214,0.5);
      color: var(--accent-bright);
    }

    /* Corner registration marks framing the whole viewport */
    .viewport-corner { position: fixed; width: 28px; height: 28px; z-index: 3; pointer-events: none; }
    .viewport-corner::before, .viewport-corner::after { content: ''; position: absolute; background: var(--border-bright); }
    .viewport-corner::before { width: 100%; height: 1px; top: 0; }
    .viewport-corner::after { width: 1px; height: 100%; left: 0; }
    .vc-tl { top: 20px; left: 20px; }
    .vc-tr { top: 20px; right: 20px; }
    .vc-tr::before { transform: none; }
    .vc-bl { bottom: 20px; left: 20px; }
    .vc-bl::before { bottom: 0; top: auto; }
    .vc-br { bottom: 20px; right: 20px; }
    .vc-br::before { bottom: 0; top: auto; }
    .vc-br::after { right: 0; left: auto; }
    .vc-tr::after { right: 0; left: auto; }
  </style>
</head>
<body>
  <div class="grid-field" aria-hidden="true"></div>
  <div class="scan-bar" aria-hidden="true"></div>
  <div class="viewport-corner vc-tl" aria-hidden="true"></div>
  <div class="viewport-corner vc-tr" aria-hidden="true"></div>
  <div class="viewport-corner vc-bl" aria-hidden="true"></div>
  <div class="viewport-corner vc-br" aria-hidden="true"></div>

  <main class="page-404">
    <div class="broken-qr-wrap" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
            <defs><clipPath id="bgc"><rect width="256" height="256" rx="51.2"/></clipPath></defs>
            <rect width="256" height="256" rx="51.2" fill="#1e3a8a"/>
            
            <g opacity="1" transform="translate(128,128) rotate(0)" color="#ffffff"><svg x="-99.84" y="-99.84" width="199.68" height="199.68" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /> <path d="M7 17l0 .01" /> <path d="M14 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /> <path d="M7 7l0 .01" /> <path d="M4 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /> <path d="M17 7l0 .01" /> <path d="M14 14l3 0" /> <path d="M20 14l0 .01" /> <path d="M14 14l0 3" /> <path d="M14 20l3 0" /> <path d="M17 17l3 0" /> <path d="M20 17l0 3" /> </svg></g>
            
        </svg>
    </div>

    <span class="code-label">Scan failed — no route found</span>

    <div class="err-num">404</div>

    <div class="text-section">
      <p class="err-title">Signal lost.</p>
      <p class="err-sub">The code you scanned points to a page that doesn't exist. Let's get you back to solid ground.</p>
    </div>

    <a href="index.html" class="home-link">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M11 7H3M6 4L3 7l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to QRForge
    </a>
  </main>

  <script src="js/config.js"></script>
</body>
</html>
