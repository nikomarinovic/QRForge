<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRForge — Maintenance</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface-0);
      overflow: hidden;
    }

    /* Blueprint drafting grid */
    .maint-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(127,217,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(127,217,255,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridDrift 20s linear infinite;
    }
    @keyframes gridDrift {
      from { background-position: 0 0; }
      to   { background-position: 48px 48px; }
    }

    .maint-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(44,92,214,0.24) 0%, transparent 70%);
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes glowPulse {
      from { transform: translate(-50%,-50%) scale(0.9); opacity: 0.7; }
      to   { transform: translate(-50%,-50%) scale(1.1); opacity: 1; }
    }

    .maint-card {
      position: relative;
      z-index: 2;
      background: var(--surface-glass-strong);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xl);
      padding: 3rem 3.5rem;
      max-width: 480px;
      width: 90%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      box-shadow: var(--shadow-lg);
    }

    .maint-icon {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-glow);
      animation: iconBob 3s ease-in-out infinite;
    }
    @keyframes iconBob {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .status-tag {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent);
      background: rgba(44,92,214,0.14);
      border: 1px solid rgba(44,92,214,0.35);
      padding: 5px 12px; border-radius: 3px;
    }
    .status-tag::before { content: ''; width: 5px; height: 5px; background: var(--accent); box-shadow: 0 0 6px var(--accent); border-radius: 50%; animation: pulseDot 1.6s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .maint-title {
      font-family: var(--font-display);
      font-size: 1.875rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .maint-sub {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Animated dots */
    .loading-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dot {
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 1px;
      animation: dotBounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%,80%,100% { transform: scale(0.6); opacity: 0.4; }
      40%          { transform: scale(1); opacity: 1; }
    }
    .maint-icon {
  width: 60px;
  height: 60px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-glow);
  animation: iconBob 3s ease-in-out infinite;
}
.maint-icon svg {
  display: block;
  width: 100%;
  height: 100%;
}
  </style>
</head>
<body>
  <div class="maint-bg" aria-hidden="true"></div>
  <div class="maint-glow" aria-hidden="true"></div>

  <div class="maint-card">
    <span class="status-tag">System offline</span>
    <div class="maint-icon">
      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
            <defs><clipPath id="bgc"><rect width="256" height="256" rx="51.2"/></clipPath></defs>
            <rect width="256" height="256" rx="51.2" fill="#1e3a8a"/>
            
            <g opacity="1" transform="translate(128,128) rotate(0)" color="#ffffff"><svg x="-99.84" y="-99.84" width="199.68" height="199.68" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /> <path d="M7 17l0 .01" /> <path d="M14 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /> <path d="M7 7l0 .01" /> <path d="M4 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /> <path d="M17 7l0 .01" /> <path d="M14 14l3 0" /> <path d="M20 14l0 .01" /> <path d="M14 14l0 3" /> <path d="M14 20l3 0" /> <path d="M17 17l3 0" /> <path d="M20 17l0 3" /> </svg></g>
            
      </svg>
    </div>
    <h1 class="maint-title">We'll be back soon.</h1>
    <p class="maint-sub">QRForge is undergoing scheduled maintenance. We're upgrading the system — back shortly.</p>
    <div class="loading-dots" aria-label="Loading">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
